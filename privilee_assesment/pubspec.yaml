name: privilee_assesment
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  bloc: ^9.0.0  
  build_runner: ^2.5.4
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  go_router: ^16.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  mockito: ^5.4.6
  very_good_analysis: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/jsons/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Niveau Grotesk
      fonts:
          - asset: assets/fonts/NiveauGroteskRegular.otf

